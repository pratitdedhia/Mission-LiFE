name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Vite application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyAFOm7HLfYxob_v2CWH6urwCgs6LqqJrtQ' }}
          VITE_FIREBASE_AUTH_DOMAIN: "hackcult-f9a20.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "hackcult-f9a20"
          VITE_FIREBASE_STORAGE_BUCKET: "hackcult-f9a20.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "640710734480"
          VITE_FIREBASE_APP_ID: "1:640710734480:web:f494e272fad279c9afde15"
          VITE_FIREBASE_MEASUREMENT_ID: "G-XCGCXXSN2V"
          VITE_ENABLE_DEMO_LOGIN: "true"
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD || 'MissionLiFE@2026' }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
